# Локальный запуск всего стека: docker compose up -d --build
# Схема повторяет деплой на PaaS: фронтенд и API — разные адреса, связь через CORS.
# Переменные берутся из .env рядом с этим файлом (см. .env.example)

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: coffeecrm
    volumes:
      # С Postgres 18 данные лежат в подпапке версии — монтируем родительскую папку
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee -d coffeecrm"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./CoffeeBackend
    init: true
    environment:
      DATABASE_URL: postgresql://coffee:${POSTGRES_PASSWORD}@db:5432/coffeecrm
      JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET в .env}
      CLIENT_ORIGIN: http://localhost:${WEB_PORT:-8080}
      SEED_ON_START: "true"
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@test.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?задайте SEED_ADMIN_PASSWORD в .env}
      SEED_CASHIER_EMAIL: ${SEED_CASHIER_EMAIL:-cashier@test.com}
      SEED_CASHIER_PASSWORD: ${SEED_CASHIER_PASSWORD:?задайте SEED_CASHIER_PASSWORD в .env}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./CoffeeFrontend
      args:
        VITE_API_URL: http://localhost:${API_PORT:-3000}/api
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
